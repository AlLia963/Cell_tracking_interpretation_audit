name: Constructed software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-verified.txt
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_examples.py --output outputs/ci
